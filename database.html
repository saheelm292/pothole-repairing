<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pothole Repair - Database</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f7;
      padding: 30px 15px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 {
      color: #1e293b;
      font-size: 22px;
    }
    .back-btn {
      padding: 8px 16px;
      background: #64748b;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    .back-btn:hover {
      background: #475569;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 12px;
      text-align: left;
      vertical-align: middle;
    }
    th {
      background-color: #2563eb;
      color: white;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #f8fafc;
    }
    .pothole-img {
      width: 120px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
    }
    .map-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 10px;
      background-color: #0284c7;
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      transition: background 0.2s ease;
    }
    .map-btn:hover {
      background-color: #0369a1;
    }
    .btn-delete {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s ease;
    }
    .btn-delete:hover {
      background-color: #dc2626;
    }
    .empty-state {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>Pothole Repairing - Reports Database</h1>
      <a href="index.html" class="back-btn">&larr; Back to Form</a>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 35%;">Location</th>
          <th style="width: 25%;">Pothole Image</th>
          <th style="width: 20%;">Date & Time</th>
          <th style="width: 20%;">Action</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="4" class="empty-state">Loading records from Firebase...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCmpJq4oV5Iq4wG1gPVc8gA9a2S3vgPPIc",
      authDomain: "pothole-repair-9555f.firebaseapp.com",
      databaseURL: "https://pothole-repair-9555f-default-rtdb.firebaseio.com",
      projectId: "pothole-repair-9555f",
      storageBucket: "pothole-repair-9555f.firebasestorage.app",
      messagingSenderId: "531359555111",
      appId: "1:531359555111:web:f90a03f444a4f85e81b802",
      measurementId: "G-JMB126B4HP"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const tableBody = document.getElementById('tableBody');

    // ലൈവായി ഡാറ്റാബേസിൽ നിന്ന് വിവരങ്ങൾ വായിക്കുന്നു
    db.ref('pothole_reports').on('value', (snapshot) => {
      tableBody.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        Object.keys(data).reverse().forEach((key) => {
          const item = data[key];
          const row = document.createElement('tr');

          // മാപ്പ് ലിങ്ക് തയ്യാറാക്കൽ (GPS കോർഡിനേറ്റ്സ് ഉണ്ടെങ്കിൽ അത് ഉപയോഗിക്കും)
          let mapUrl = '';
          if (item.latitude && item.longitude) {
            mapUrl = `https://www.google.com/maps?q=${item.latitude},${item.longitude}`;
          } else if (item.location) {
            mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}`;
          }

          row.innerHTML = `
            <td>
              <strong>${item.location || 'Not Specified'}</strong><br>
              ${mapUrl ? `<a href="${mapUrl}" target="_blank" class="map-btn">📍 Open in Google Maps</a>` : ''}
            </td>
            <td>
              ${item.image ? `<img src="${item.image}" class="pothole-img" alt="Pothole">` : 'No Image'}
            </td>
            <td style="font-size: 13px; color: #475569;">${item.timestamp || 'N/A'}</td>
            <td>
              <button class="btn-delete" onclick="deleteRecord('${key}')">Delete Data</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } else {
        tableBody.innerHTML = '<tr><td colspan="4" class="empty-state">No pothole reports found yet.</td></tr>';
      }
    }, (error) => {
      tableBody.innerHTML = `<tr><td colspan="4" class="empty-state" style="color:red;">Error fetching data: ${error.message}</td></tr>`;
    });

    // ഡാറ്റ ഡിലീറ്റ് ചെയ്യാനുള്ള ഫംഗ്ഷൻ
    function deleteRecord(key) {
      const confirmDelete = confirm("Are you sure you want to delete this pothole record?");
      if (confirmDelete) {
        db.ref('pothole_reports/' + key).remove()
          .then(() => {
            alert("Record deleted successfully!");
          })
          .catch((error) => {
            alert("Error deleting record: " + error.message);
          });
      }
    }
  </script>

</body>
</html>
