<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pothole Repair Robot - Database Logs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      background: #6c757d;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    .empty-msg {
      text-align: center;
      padding: 20px;
      color: #6c757d;
    }
  </style>

  <!-- Firebase v8 SDK scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    <h1>Pothole Detection & Repair Logs</h1>

    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Sensor Distance / Depth</th>
          <th>Action Taken</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="logsTableBody">
        <tr>
          <td colspan="4" class="empty-msg">Loading records from Firebase...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCmpJq4oV5Iq4wG1gPVc8gA9a2S3vgPPIc",
      authDomain: "pothole-repair-9555f.firebaseapp.com",
      databaseURL: "https://pothole-repair-9555f-default-rtdb.firebaseio.com",
      projectId: "pothole-repair-9555f",
      storageBucket: "pothole-repair-9555f.firebasestorage.app",
      messagingSenderId: "531359555111",
      appId: "1:531359555111:web:f90a03f444a4f85e81b802",
      measurementId: "G-JMB126B4HP"
    };

    // Firebase Initialize ചെയ്യുക
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const tableBody = document.getElementById('logsTableBody');
    const logsRef = db.ref('pothole_logs');

    // ലൈവായി ഡാറ്റ വായിച്ച് ടേബിളിൽ കാണിക്കുന്നു
    logsRef.on('value', (snapshot) => {
      tableBody.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        Object.keys(data).forEach((key) => {
          const log = data[key];
          const row = document.createElement('tr');

          row.innerHTML = `
            <td>${log.timestamp || key}</td>
            <td>${log.depth || log.distance || 'N/A'}</td>
            <td>${log.action || 'Repaired'}</td>
            <td>${log.status || 'Completed'}</td>
          `;
          tableBody.appendChild(row);
        });
      } else {
        tableBody.innerHTML = '<tr><td colspan="4" class="empty-msg">No logs found in database yet.</td></tr>';
      }
    }, (error) => {
      tableBody.innerHTML = `<tr><td colspan="4" class="empty-msg" style="color:red;">Error fetching data: ${error.message}</td></tr>`;
    });
  </script>

</body>
</html>
