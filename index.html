<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pothole Repair Robot - Control Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    .card {
      background: white;
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3 PIB;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    .status-box {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      background: #e9ecef;
      font-weight: bold;
      color: #495057;
    }
  </style>

  <!-- Firebase v8 SDK scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h1>Pothole Repair Robot</h1>

  <div class="card">
    <h2>Robot Live Control & Status</h2>
    <p>ഡാറ്റാബേസിലേക്ക് വിവരങ്ങൾ നൽകാനും ലൈവ് വിവരങ്ങൾ കാണാനും താഴെ ഉപയോഗിക്കുക.</p>
    
    <div id="status" class="status-box">Connecting to Firebase...</div>
    
    <div style="margin-top: 20px;">
      <a href="database.html" class="btn">View Database Records</a>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCmpJq4oV5Iq4wG1gPVc8gA9a2S3vgPPIc",
      authDomain: "pothole-repair-9555f.firebaseapp.com",
      databaseURL: "https://pothole-repair-9555f-default-rtdb.firebaseio.com",
      projectId: "pothole-repair-9555f",
      storageBucket: "pothole-repair-9555f.firebasestorage.app",
      messagingSenderId: "531359555111",
      appId: "1:531359555111:web:f90a03f444a4f85e81b802",
      measurementId: "G-JMB126B4HP"
    };

    // Firebase Initialize ചെയ്യുക
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // റിയൽടൈം സ്റ്റാറ്റസ് ചെക്ക് ചെയ്യൽ
    const statusDiv = document.getElementById('status');
    const statusRef = db.ref('robot/status');

    statusRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        statusDiv.innerText = "Robot Status: " + data;
        statusDiv.style.color = "#28a745";
      } else {
        statusDiv.innerText = "Robot Status: Standby / Connected to Firebase";
        statusDiv.style.color = "#007bff";
      }
    }, (error) => {
      statusDiv.innerText = "Connection Error: " + error.message;
      statusDiv.style.color = "#dc3545";
    });
  </script>

</body>
</html>
