<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pothole Repair - Report Pothole</title>
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      color: #1e293b;
      margin-bottom: 8px;
      font-size: 24px;
    }
    p.subtitle {
      color: #64748b;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
      font-size: 14px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background-color: #f8fafc;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #2563eb;
      background: #fff;
    }
    .loc-btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 10px;
      transition: background 0.2s ease;
    }
    .loc-btn:hover {
      background: #0369a1;
    }
    #map {
      width: 100%;
      height: 200px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-top: 6px;
      z-index: 1;
    }
    .preview-box {
      margin-top: 10px;
      width: 100%;
      height: 180px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f8fafc;
    }
    .preview-box img {
      max-width: 100%;
      max-height: 100%;
      display: none;
      object-fit: cover;
    }
    .preview-placeholder {
      color: #94a3b8;
      font-size: 13px;
    }
    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    .btn-submit:hover {
      background: #1d4ed8;
    }
    .db-link {
      display: inline-block;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .db-link:hover {
      text-decoration: underline;
    }
    #msg {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div class="card">
    <h1>Pothole Repair</h1>
    <p class="subtitle">report the potholes in the road</p>

    <form id="potholeForm">
      <div class="form-group">
        <label for="location">Location:</label>
        <input type="text" id="location" placeholder="Example: Main Road, Near Bridge" required>
        
        <button type="button" class="loc-btn" id="geoBtn">📍 Get Current GPS Location</button>
        
        <label style="font-size: 12px; color: #64748b;">Or tap on the map to mark spot:</label>
        <div id="map"></div>
      </div>

      <div class="form-group">
        <label for="imageInput">Pothole Image:</label>
        <input type="file" id="imageInput" accept="image/*" required>
        <div class="preview-box">
          <span class="preview-placeholder" id="placeholderText">Select an image to preview</span>
          <img id="imagePreview" alt="Pothole Preview">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Report</button>
      <div id="msg"></div>
    </form>

    <a href="database.html" class="db-link">View Database Records &rarr;</a>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCmpJq4oV5Iq4wG1gPVc8gA9a2S3vgPPIc",
      authDomain: "pothole-repair-9555f.firebaseapp.com",
      databaseURL: "https://pothole-repair-9555f-default-rtdb.firebaseio.com",
      projectId: "pothole-repair-9555f",
      storageBucket: "pothole-repair-9555f.firebasestorage.app",
      messagingSenderId: "531359555111",
      appId: "1:531359555111:web:f90a03f444a4f85e81b802",
      measurementId: "G-JMB126B4HP"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Map Setup (Leaflet)
    let selectedLat = null;
    let selectedLng = null;

    // Default Kerala coordinates
    const defaultLat = 10.8505;
    const defaultLng = 76.2711;

    const map = L.map('map').setView([defaultLat, defaultLng], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker;

    function setPin(lat, lng) {
      selectedLat = lat;
      selectedLng = lng;
      if (marker) {
        marker.setLatLng([lat, lng]);
      } else {
        marker = L.marker([lat, lng]).addTo(map);
      }
      map.setView([lat, lng], 16);
      
      const locInput = document.getElementById('location');
      if (!locInput.value.trim() || locInput.value.includes('GPS:')) {
        locInput.value = `GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      }
    }

    // മാപ്പിൽ ടാപ്പ് ചെയ്യുമ്പോൾ പിൻ വരാൻ
    map.on('click', function(e) {
      setPin(e.latlng.lat, e.latlng.lng);
    });

    // മൊബൈലിലെ/ബ്രൗസറിലെ ലൈവ് ജിപിഎസ് എടുക്കാൻ
    document.getElementById('geoBtn').addEventListener('click', function() {
      if (navigator.geolocation) {
        this.innerText = 'Fetching Location...';
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            setPin(lat, lng);
            this.innerText = '✅ Location Detected';
          },
          (error) => {
            alert('Location access denied or unavailable: ' + error.message);
            this.innerText = '📍 Get Current GPS Location';
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert('Geolocation is not supported by your browser.');
      }
    });

    let base64Image = "";
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const placeholderText = document.getElementById('placeholderText');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    imageInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64Image = e.target.result;
          imagePreview.src = base64Image;
          imagePreview.style.display = 'block';
          placeholderText.style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    });

    // ഡാറ്റ ഫയർബേസിലേക്ക് അയക്കുന്നു (Coordinates ഉൾപ്പെടെ)
    document.getElementById('potholeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const locationVal = document.getElementById('location').value.trim();

      if (!base64Image) {
        msg.style.color = '#dc2626';
        msg.innerText = 'Please select an image.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      const newRecordRef = db.ref('pothole_reports').push();
      newRecordRef.set({
        location: locationVal,
        latitude: selectedLat,
        longitude: selectedLng,
        image: base64Image,
        timestamp: new Date().toLocaleString()
      }).then(() => {
        msg.style.color = '#16a34a';
        msg.innerText = 'Report submitted successfully!';
        document.getElementById('potholeForm').reset();
        imagePreview.style.display = 'none';
        placeholderText.style.display = 'block';
        base64Image = "";
        selectedLat = null;
        selectedLng = null;
        if (marker) map.removeLayer(marker);
        document.getElementById('geoBtn').innerText = '📍 Get Current GPS Location';
      }).catch((err) => {
        msg.style.color = '#dc2626';
        msg.innerText = 'Error: ' + err.message;
      }).finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Report';
      });
    });
  </script>

</body>
</html>
